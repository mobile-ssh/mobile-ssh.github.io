<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-label="Multi-session terminal grid mockup">
  <rect width="920" height="620" rx="8" fill="#101820"/>
  <rect x="28" y="26" width="864" height="54" rx="6" fill="#1d2a33"/>
  <text x="52" y="60" fill="#f5c84b" font-family="monospace" font-size="22">4 sessions</text>
  <text x="702" y="60" fill="#2ee59d" font-family="monospace" font-size="20">+ Add Session</text>
  <g font-family="monospace" font-size="16">
    <rect x="28" y="108" width="420" height="212" rx="6" fill="#0d151b" stroke="#2ee59d" stroke-width="2"/>
    <rect x="472" y="108" width="420" height="212" rx="6" fill="#0d151b" stroke="#76d7ff" stroke-width="2"/>
    <rect x="28" y="346" width="420" height="212" rx="6" fill="#0d151b" stroke="#f5c84b" stroke-width="2"/>
    <rect x="472" y="346" width="420" height="212" rx="6" fill="#0d151b" stroke="#ff7a59" stroke-width="2"/>
    <text x="52" y="150" fill="#2ee59d">web-01</text>
    <text x="52" y="188" fill="#d6e2e8">$ tail -f access.log</text>
    <text x="52" y="226" fill="#d6e2e8">200 GET /api/status</text>
    <text x="496" y="150" fill="#76d7ff">db-01</text>
    <text x="496" y="188" fill="#d6e2e8">$ psql app</text>
    <text x="496" y="226" fill="#d6e2e8">app=&gt; select count(*)</text>
    <text x="52" y="388" fill="#f5c84b">worker</text>
    <text x="52" y="426" fill="#d6e2e8">$ tmux attach -t jobs</text>
    <text x="52" y="464" fill="#d6e2e8">queue depth: 0</text>
    <text x="496" y="388" fill="#ff7a59">lab</text>
    <text x="496" y="426" fill="#d6e2e8">$ htop</text>
    <text x="496" y="464" fill="#d6e2e8">load average: 0.18</text>
  </g>
</svg>
