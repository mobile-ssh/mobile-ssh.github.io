<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Mobile SSH terminal session mockup">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#e9eef1"/>
  <rect x="0" y="0" width="1600" height="900" fill="#101820" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="610" y="84" width="430" height="780" rx="48" fill="#12181f"/>
    <rect x="638" y="124" width="374" height="704" rx="24" fill="url(#screen)"/>
    <rect x="676" y="154" width="298" height="20" rx="10" fill="#1f2d38"/>
    <rect x="660" y="204" width="336" height="238" rx="8" fill="#0d151b" stroke="#263640"/>
    <rect x="674" y="218" width="308" height="28" fill="#17242d"/>
    <text x="688" y="237" fill="#f5c84b" font-family="monospace" font-size="16">prod-api</text>
    <text x="678" y="278" fill="#2ee59d" font-family="monospace" font-size="15">$ ssh deploy@app</text>
    <text x="678" y="306" fill="#d6e2e8" font-family="monospace" font-size="15">uptime: 41 days</text>
    <text x="678" y="334" fill="#d6e2e8" font-family="monospace" font-size="15">tmux attach -t work</text>
    <text x="678" y="362" fill="#76d7ff" font-family="monospace" font-size="15">logs streaming...</text>
    <rect x="660" y="456" width="160" height="168" rx="8" fill="#0d151b" stroke="#2d4652"/>
    <rect x="836" y="456" width="160" height="168" rx="8" fill="#0d151b" stroke="#2d4652"/>
    <text x="674" y="488" fill="#2ee59d" font-family="monospace" font-size="13">db01</text>
    <text x="674" y="520" fill="#d6e2e8" font-family="monospace" font-size="12">psql ready</text>
    <text x="850" y="488" fill="#f5c84b" font-family="monospace" font-size="13">worker</text>
    <text x="850" y="520" fill="#d6e2e8" font-family="monospace" font-size="12">queue ok</text>
    <rect x="660" y="650" width="336" height="48" rx="8" fill="#24333f"/>
    <text x="676" y="681" fill="#d6e2e8" font-family="monospace" font-size="16">ESC TAB CTRL HOME PGUP</text>
    <rect x="660" y="718" width="336" height="72" rx="10" fill="#101820" stroke="#2ee59d" opacity="0.9"/>
    <text x="678" y="750" fill="#2ee59d" font-family="monospace" font-size="14">127.0.0.1:8080 -> localhost:8080</text>
    <text x="678" y="776" fill="#d6e2e8" font-family="monospace" font-size="14">SFTP transfer complete</text>
  </g>
  <g opacity="0.78" filter="url(#shadow)">
    <rect x="1050" y="190" width="340" height="480" rx="18" fill="#12181f"/>
    <rect x="1072" y="224" width="296" height="184" rx="8" fill="#0d151b" stroke="#324956"/>
    <rect x="1088" y="242" width="122" height="22" rx="4" fill="#263640"/>
    <rect x="1224" y="242" width="122" height="22" rx="4" fill="#263640"/>
    <text x="1090" y="294" fill="#d6e2e8" font-family="monospace" font-size="13">Download</text>
    <text x="1090" y="326" fill="#76d7ff" font-family="monospace" font-size="13">backup.tar.gz</text>
    <text x="1090" y="358" fill="#2ee59d" font-family="monospace" font-size="13">100%</text>
    <rect x="1072" y="432" width="296" height="150" rx="8" fill="#0d151b" stroke="#324956"/>
    <text x="1090" y="474" fill="#f5c84b" font-family="monospace" font-size="14">Saved servers</text>
    <text x="1090" y="506" fill="#d6e2e8" font-family="monospace" font-size="13">deploy@prod:22</text>
    <text x="1090" y="536" fill="#d6e2e8" font-family="monospace" font-size="13">root@lab:2202</text>
  </g>
</svg>
